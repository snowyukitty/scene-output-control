name: Bug report
description: Report a reproducible installation, preset, or audio problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and check the [setup guide](https://snowyukitty.github.io/scene-output-control/) first.
        Remove secrets, private paths, device identifiers, and personal content from logs or screenshots.
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: Include plugin version or commit, OBS version, OS, architecture, and OBS distribution (native, portable, Flatpak, etc.).
      placeholder: Plugin 1.1.1; OBS 31.1.1; Windows 11 x64; native OBS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the source type, enabled overrides, and whether an OBS output is active. Use a minimal scene if possible.
      placeholder: |
        1. Open a disposable scene collection...
        2. Set...
        3. Press...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: What should happen, and what happened instead? Include any dock status or error text.
    validations:
      required: true
  - type: textarea
    id: audio
    attributes:
      label: Audio route and recording result (for audio issues)
      description: Include application output, OBS source, monitoring mode/device, recorded track, Windows Listen/mixer forwarding, what you hear, meter behavior, and saved-file audio. Say if the saved file was not tested.
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence (optional)
      description: Paste a short relevant OBS log excerpt or attach a cropped screenshot. Do not include stream keys, private recordings, or entire scene collections.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I checked that this report and its attachments contain no secrets or private content.
          required: true
